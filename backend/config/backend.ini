; =============================================================================
;  AgriSphere C++ backend configuration
; =============================================================================
;  These values must match includes/config.php on the PHP side.
;  Restart agrisphere_backend.exe after editing this file.
; =============================================================================

[database]
host = 127.0.0.1
port = 3306
user = root
; XAMPP's default MySQL root account has no password. If you set one in
; phpMyAdmin, put it here AND in includes/config.php (DB_PASS).
password =
name = cse311 lab project
charset = utf8mb4
connect_timeout_ms = 5000
read_timeout_ms = 30000

[server]
; Loopback only: the API is for the local Apache/PHP tier.
; Change to 0.0.0.0 later if an Android device on your LAN must reach it.
bind = 127.0.0.1
port = 8787
worker_threads = 8
; Number of MySQL connections the Singleton keeps open. Keep this at or below
; worker_threads.
db_pool_size = 4
; Shared secret. PHP sends it in the X-Agri-Key header.
; Must match BACKEND_API_KEY in includes/config.php.
api_key = agrisphere-local-dev-key
; Leave empty to log to the console only.
log_file = backend.log

[app]
; Mirrors ADMIN_USERNAME / ADMIN_PASSWORD in includes/config.php.
admin_username = admin
admin_password = admin123
; Session user id used when no Admin row exists in the `user` table.
admin_fallback_user_id = 9999999
otp_lifetime_minutes = 10
